[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framelock"
version = "0.1.0"
description = "Operator-designated camera target lock and auto-framing for civilian camera drones (cloud or local detection)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
mavlink = ["pymavlink>=2.4"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
framelock = "framelock.cli:main"

[tool.setuptools.packages.find]
include = ["framelock*"]

[tool.setuptools.package-data]
framelock = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
